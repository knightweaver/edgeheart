name: Publish Edgeheart Release

on:
  push:
    branches:
      - main
    paths:
      - "release-control/*.json"
  workflow_dispatch:
    inputs:
      control:
        description: "Release-control file"
        required: true
        default: "release-control/v0.1.0.json"

concurrency:
  group: edgeheart-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_CONTROL: ${{ github.event.inputs.control || 'release-control/v0.1.0.json' }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install build dependencies
        run: npm install --no-audit --no-fund

      - name: Read release control
        id: control
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          data=json.load(open(os.environ["RELEASE_CONTROL"]))
          print(f"version={data['version']}")
          print(f"tag={data['tag']}")
          print(f"archive=edgeheart-v{data['version']}.zip")
          print(f"qualified_run_id={data['qualifiedWorkflowRunId']}")
          print(f"qualified_artifact={data['qualifiedArtifactName']}")
          PY

      - name: Rebuild deterministic source tree
        run: |
          npm run build:sources -- sources/edgeheart-consolidated-production-v1.0.zip
          npm run validate:sources
          npm run resolve:references
          npm run validate:references
          npm run validate:competencies
          npm run rewrite:assets
          npm run validate:assets

      - name: Compile and validate all Compendia
        run: |
          npm run clean:packs
          npm run compile:packs
          npm run validate:compiled-packs

      - name: Build fresh runtime candidate
        run: |
          npm run build:runtime-package
          mv "release/${{ steps.control.outputs.archive }}"              "release/edgeheart-v${{ steps.control.outputs.version }}-rebuilt.zip"

      - name: Download exact Step 8 qualified candidate
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.control.outputs.qualified_artifact }}
          path: qualified-step8
          github-token: ${{ github.token }}
          run-id: ${{ steps.control.outputs.qualified_run_id }}

      - name: Prove rebuilt runtime equivalence
        run: |
          python tools/compare-runtime-packages.py             --repo .             --qualified "qualified-step8/release/${{ steps.control.outputs.archive }}"             --rebuilt "release/edgeheart-v${{ steps.control.outputs.version }}-rebuilt.zip"

      - name: Stage exact qualified runtime for publication
        run: |
          cp "qualified-step8/release/${{ steps.control.outputs.archive }}"              "release/${{ steps.control.outputs.archive }}"

      - name: Enforce release gates
        run: |
          python tools/prepare-release.py --repo . --control "$RELEASE_CONTROL"

      - name: Publish or refresh GitHub release
        shell: bash
        run: |
          TAG="${{ steps.control.outputs.tag }}"
          ARCHIVE="${{ steps.control.outputs.archive }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG"               "release/$ARCHIVE"               "release/module.json"               "release/SHA256SUMS.txt"               --clobber
            gh release edit "$TAG"               --title "Edgeheart $TAG"               --notes-file RELEASE-NOTES-v0.1.0.md
          else
            gh release create "$TAG"               "release/$ARCHIVE"               "release/module.json"               "release/SHA256SUMS.txt"               --target "$GITHUB_SHA"               --title "Edgeheart $TAG"               --notes-file RELEASE-NOTES-v0.1.0.md
          fi

      - name: Verify published release assets
        shell: bash
        run: |
          TAG="${{ steps.control.outputs.tag }}"
          ARCHIVE="${{ steps.control.outputs.archive }}"
          gh release view "$TAG" --json tagName,isDraft,isPrerelease,url,assets > published-release.json
          ARCHIVE="$ARCHIVE" python - <<'PY'
          import json, os
          data=json.load(open("published-release.json"))
          names=sorted(a["name"] for a in data["assets"])
          expected=sorted([os.environ["ARCHIVE"],"module.json","SHA256SUMS.txt"])
          if data["isDraft"] or data["isPrerelease"]:
              raise SystemExit("Release must be a published non-prerelease")
          if names != expected:
              raise SystemExit(f"Release assets mismatch: {names}")
          print(json.dumps(data,indent=2))
          PY

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: edgeheart-v0.1.0-release-evidence
          path: |
            build/step8/
            build/step9/
            release/SHA256SUMS.txt
            published-release.json
          if-no-files-found: error
          retention-days: 90
