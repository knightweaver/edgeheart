name: Rewrite Edgeheart Asset Paths

on:
  push:
    branches:
      - main
    paths:
      - "tools/rewrite-asset-paths.py"
      - "tools/validate-asset-paths.py"
      - "ASSET-STAGING.md"
      - ".github/workflows/rewrite-asset-paths.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rewrite-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rewrite deterministic asset paths
        run: |
          python tools/rewrite-asset-paths.py --repo .

      - name: Validate rewritten asset paths
        run: |
          python tools/validate-asset-paths.py --repo .

      - name: Commit rewritten source documents and Step 6 report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/packs build/step6
          if git diff --cached --quiet; then
            echo "Step 6 asset paths are already current."
            exit 0
          fi
          git commit -m "Rewrite Edgeheart Step 6 asset paths"
          git push
