name: Validate Edgeheart Competencies

on:
  push:
    branches:
      - main
    paths:
      - "scripts/competencies.js"
      - "scripts/main.js"
      - "tools/validate-competency-registration.mjs"
      - "src/packs/system/domains/**"
      - "src/packs/system/classes/**"
      - ".github/workflows/validate-competencies.yml"

permissions:
  contents: write

jobs:
  validate-competencies:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate native Competency registration
        run: |
          node tools/validate-competency-registration.mjs

      - name: Commit Step 5 validation report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/step5
          if git diff --cached --quiet; then
            echo "Step 5 validation report is already current."
            exit 0
          fi
          git commit -m "Validate Edgeheart Step 5 Competencies"
          git push
