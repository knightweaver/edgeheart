name: Compile Edgeheart Compendia

on:
  push:
    branches:
      - main
    paths:
      - "tools/compile-packs.mjs"
      - "tools/validate-compiled-packs.mjs"
      - "tools/build-runtime-package.py"
      - "package.json"
      - "module.json"
      - "src/packs/**"
      - ".github/workflows/compile-compendia.yml"
  workflow_dispatch:

concurrency:
  group: edgeheart-compendium-build-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  compile-compendia:
    runs-on: ubuntu-latest

    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install build dependencies
        run: |
          npm install --no-audit --no-fund

      - name: Re-run source and deployment gates
        run: |
          npm run validate
          npm run validate:sources
          npm run validate:references
          npm run validate:competencies
          npm run validate:assets

      - name: Compile all declared Compendia
        run: |
          npm run clean:packs
          npm run compile:packs

      - name: Re-extract and validate compiled Compendia
        run: |
          npm run validate:compiled-packs

      - name: Build deterministic runtime candidate
        run: |
          npm run build:runtime-package

      - name: Upload compiled pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: edgeheart-compiled-packs-v0.1.0
          path: |
            packs/
            build/step7/
          if-no-files-found: error
          retention-days: 30

      - name: Upload runtime qualification candidate
        uses: actions/upload-artifact@v4
        with:
          name: edgeheart-runtime-candidate-v0.1.0
          path: |
            release/edgeheart-v0.1.0.zip
            build/step7/runtime-package.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit Step 7 validation report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/step7
          if git diff --cached --quiet; then
            echo "Step 7 validation report is already current."
            exit 0
          fi
          git commit -m "Validate Edgeheart Step 7 Compendia"
          git pull --rebase origin main
          git push
