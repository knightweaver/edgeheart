name: Validate Staged Edgeheart Assets

on:
  push:
    branches:
      - main
    paths:
      - "tools/generate-competency-glyphs.py"
      - "assets/icons/domains/*.svg"
      - "tools/validate-asset-paths.py"
      - ".github/workflows/validate-staged-assets.yml"
  workflow_dispatch:

concurrency:
  group: edgeheart-generated-reports-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate-staged-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate approved Competency glyphs
        run: |
          python tools/generate-competency-glyphs.py --repo .

      - name: Refresh Step 6 asset manifest
        run: |
          python tools/rewrite-asset-paths.py --repo .

      - name: Require and validate all staged assets
        run: |
          python tools/validate-asset-paths.py --repo . --require-assets

      - name: Commit generated glyphs and final Step 6 report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/icons/domains/*.svg build/step6
          if git diff --cached --quiet; then
            echo "Competency glyphs and Step 6 report are already current."
            exit 0
          fi
          git commit -m "Stage approved Edgeheart Competency SVG glyphs"
          git pull --rebase origin main
          git push
